name: RankLens CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RankLens.slnx

      - name: Install verified OCR models
        shell: pwsh
        run: |
          $manifest = Get-Content ./models/manifest.json -Raw | ConvertFrom-Json
          ./scripts/install-ocr-models.ps1 `
            -DetectionUrl $manifest.detectionSourceUrl `
            -DetectionSha256 $manifest.detectionSha256 `
            -RecognitionUrl $manifest.recognitionSourceUrl `
            -RecognitionSha256 $manifest.recognitionSha256 `
            -DictionaryUrl $manifest.dictionarySourceUrl `
            -DictionarySha256 $manifest.characterDictionarySha256 `
            -ModelVersion $manifest.modelVersion `
            -SourceRevision $manifest.sourceRevision `
            -LicenseNotice $manifest.license

      - name: Build
        run: dotnet build RankLens.slnx --no-restore --configuration Release -p:NuGetAudit=false

      - name: Test
        run: dotnet test RankLens.slnx --no-restore --configuration Release -p:NuGetAudit=false --verbosity:minimal

      - name: Verify release security gates
        shell: pwsh
        run: ./scripts/test-release-security.ps1
